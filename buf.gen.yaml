# Generates the Rust protobuf types for io.prometheus.client (metrics.proto).
#
# Run:
#   buf generate buf.build/prometheus/prometheus --path io/prometheus/client/metrics.proto
#
# The pinned source revision is the BSR commit
#   d7f6cfecf2b847ac88aaf37f43438807 (2026-10-01T22:40:11Z),

version: v2
plugins:
  - remote: buf.build/anthropics/buffa:v0.9.2
    out: generated
    opt:
      - file_per_package=true
